<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "css/styles.css">
    <title>Sign Up Form</title>
</head>
<body>
    <form id = "sign-up-form" action = "#" method = "post>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="100%" height="100%">
            <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="68" font-weight="200" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" letter-spacing="-1px">
                YueKnowWho
            </text>
        </svg>
        <div class = "name">
            <div class = "field">
                <label for = "first-name">First Name</label>
                <input id = "first-name" type = "text" name = "first-name" placeholder = "First Name" required>
            </div>
            <div class = "field">
                <label for = "last-name">Last Name</label>
                <input id = "last-name" type = "text" name = "last-name" placeholder = "Last Name" required>
            </div>
        </div>
        <div class = "contact">
            <div class = "field">
                <label for = "email">Email</label>
                <input id = "email" type = "email" name = "email" placeholder = "Email" required>
            </div>
            <div class = "field">
                <label for = "phone-number">Phone Number</label>
                <input id = "phone-number" type = "tel" name = "phone-number"
                    placeholder = "Phone Number" pattern = "(?:\+1\s?)?(?:\(\d{3}\)|\d{3})(?:-|\s|\.)?\d{3}(?:-|\s|\.)?\d{4}"
                    title = "Enter a valid phone number, such as (555) 123-4567" required>
            </div>
        </div>
        <div class = "password">
            <div class = "field">
                <label for = "password">Password</label>
                <input id = "password" type = "password" name = "password" placeholder = "Password"
                    minlength = "8" required>
            </div>
            <div class = "field">
                <label for = "confirm-password">Confirm Password</label>
                <input id = "confirm-password" type = "password" name = "confirm-password"
                    placeholder = "Confirm Password" minlength = "8" required>
            </div>
            <p id = "password-message" class = "password-message" aria-live = "polite"></p>
        </div>
        <button type = "submit">Create Account</button>
        <p class = "login-prompt">
            Already have an account? <a href = "#">Log in</a>
        </p>
    </form>
    <script src = "js/script.js"></script>
</body>
</html>
